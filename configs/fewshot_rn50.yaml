model:
  name: recalcon
  backbone: RN50
  freeze: true
  language_adapter: true
  vision_adapter: true
  adapter: small_mlp
  adapter_residual: false
  n_ctx: 0
  init_text: false

data:
  root: ./data
  train: dtd
  eval: dtd
  n_shot: 16
  num_workers: 4
  image_size: 224
  randaug: rand-m7-mstd0.5-inc1
  k_ops: 2
  scale: [0.9, 1.0]
  ratio: [0.75, 1.33]
  hflip: 0.5
  vflip: 0.0
  interpolation: bicubic
  crop_pct: 1.0
  text_prompt: align

loss:
  name: recalibrated
  fusion_alpha: 1.0
  image_fusion_prob: 0.8
  focal_gamma: 2.0

train:
  epochs: 100
  batch_size: 256
  total_batch: 256
  grad_accumulation: 1
  opt: adamw
  lr: 1.25e-6
  adapter_lr: 5.0e-4
  prompt_lr: null
  weight_decay: 1.0e-1
  opt_eps: 1.0e-6
  opt_betas: [0.9, 0.999]
  clip_grad: null
  sched: cosine
  warmup_epochs: 1
  cooldown_epochs: 1
  warmup_lr: 0.0
  min_lr: 0.0
  sched_on_updates: true
  seed: 42
  precision: 16-mixed
  gpus: [0]
  channels_last: true
  dist_bn: reduce
  log_interval: 50
  output_dir: outputs/fewshot_rn50
  resume: ""
  criteria_metric: Top1
  criteria_decreasing: false
  wandb: false

eval:
  batch_size: 512
  num_workers: 4
  cache: false
  checkpoint: ""
