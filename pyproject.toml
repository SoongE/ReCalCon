[project]
name = "recalcon"
version = "1.0.0"
description = "ReCalCon — Re-calibrated Contrastive Loss for Transformation-Aware Prompt Conditioning in Vision-Language Models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Seungmin Oh" }, { name = "Seunghun Kang" }, { name = "Jongbin Ryu" }]

dependencies = [
    "torch==2.2.1",
    "torchvision==0.17.1",
    "timm>=1.0.20",
    "accelerate>=0.34",
    "ftfy",
    "regex",
    "numpy<2",
    "h5py",
    "pillow>=9.0",
    "safetensors",
    "pandas",
    "pyyaml",
    "tqdm",
    "rich",
    "termcolor",
    "wandb",
]

[project.urls]
Repository = "https://github.com/SoongE/ReCalCon"

[dependency-groups]
iwildcam = [
    "wilds>=2.0",
]
dev = [
    "ruff",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
default-groups = ["dev"]
python-preference = "managed"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recalcon"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/recalcon/clip/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
